[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps4-firmware-lab"
version = "0.17.0"
description = "Research scaffolding for local PS4 payload-development experiments"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["host*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
